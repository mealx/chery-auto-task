name: 每日积分任务

on:
  schedule:
    # 每天北京时间 08:17 = UTC 00:17（主）—— 避开整点：GitHub 在每小时整点负载最高，
    # 排队任务会被静默丢弃，且丢弃后 run 列表里不留任何记录
    - cron: "17 0 * * *"
    # 每天北京时间 12:23 = UTC 04:23（备用，早上那次被吞时补跑；幂等：签到/分享/已搬帖子重复跑不重复算分）
    - cron: "23 4 * * *"
  workflow_dispatch:  # 允许手动点一下立即跑一次

env:
  # 日志实时输出，不然所有 print 会挤在同一秒里，看不出真实耗时
  PYTHONUNBUFFERED: "1"
  # 视频一条都没发出去时让 step 变红（设 0 关闭）
  CHERY_STRICT_EXIT: "1"

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pycryptodome imageio-ffmpeg

      - name: Run sign-in and share
        env:
          CHERY_TOKEN: ${{ secrets.CHERY_TOKEN }}
        run: python src/daily.py --quick-only

      # 注：Download videos / Make daily videos 两步已移除。
      # 搬运链路（do_repost_videos）是从社区广场扒视频，不读 videos/raw 与 videos/out，
      # 那两步只是每天白等 2 分半并按 403/567 刷日志。video_downloader.py / video_maker.py 保留备用。

      - name: Run video tasks
        env:
          CHERY_TOKEN: ${{ secrets.CHERY_TOKEN }}
        run: python src/daily.py --video-only
