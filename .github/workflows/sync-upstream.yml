name: Sync Upstream

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jiuzihe36/chery-auto-task.git
          git fetch upstream
          git merge upstream/main -X theirs --allow-unrelated-histories -m "chore: sync upstream changes"
          git push
